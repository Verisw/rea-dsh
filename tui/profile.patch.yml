# 回退方案：只在宿主不读 profile bundle 时才用。
#
# 1.0.0 起 bundle 本身就能覆盖 desktop / web / headless / dsh-tui 四个 profile
# （npm run link:all 一次装齐），根本不需要这个文件。仅当你的 dsh-tui 版本
# 不从 dsh.profile.bundles 里取 bundle 时，才把下面这段并进
# ~/.dsh/profiles/dsh-tui/cordis.patch.yml，并改一处：把 include 的 path 换成
# 本机这份仓库的绝对路径（file:// + tui/agent.cordis.yml）。
#
# 注意：bundle 与这段同时生效会得到两条 preset-reverse 行，只留一个。

- insert:
    - id: preset-reverse
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: reverse
        name: 逆向工程模式
        description: 面向已发布软件（原生二进制 / Electron / 托管程序集 / 移动与固件制品 / 运行中进程）的逆向模式：挂载 REA MCP 工具与逆向工作流技能，产出带证据落点、可重建的结论。
        order: 5
        plugins:
          - id: reverse-composition
            name: '@deepseek-ai/cordis-plugin-include'
            config:
              path: 'file:///REPLACE_WITH_ABSOLUTE_PATH/rea-dsh/tui/agent.cordis.yml'
