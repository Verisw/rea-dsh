name: release

# 发布到 npm。三种情形：
#
#   dry_run=true（手动触发）→ 走完前置校验，只跑 `npm publish --dry-run`，不碰 registry。
#   有 NPM_TOKEN secret      → 用它发布。首次发布只能走这条：npm 的 Trusted Publisher
#                              只能挂在**已存在**的包上，新包没有那个设置页可填。
#   没有 NPM_TOKEN           → OIDC Trusted Publishing：GitHub 现场签短期令牌，npm 校验
#                              「仓库 + workflow 文件名 + 触发方式」，仓库里不留长期密钥。
#                              需要 npm >= 11.5.1，所以下面显式升级 npm。
#
# 触发：推 v* tag（tag 必须等于 package.json 的 version），或手动 dispatch。
# provenance 会把「哪个 commit、哪个 workflow、哪次运行」写进包元数据，
# 因此 permissions 里的 id-token: write 不能删。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只做前置校验和 npm publish --dry-run，不真正发布'
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: upgrade npm (OIDC trusted publishing needs >= 11.5.1)
        run: npm install -g npm@latest && npm --version

      - name: install dev deps
        run: npm install --no-audit --no-fund

      - name: verify the package before publishing
        run: |
          node scripts/verify.mjs
          node scripts/sync-tui.mjs --check
          node scripts/publish-check.mjs

      - name: publish --dry-run
        if: env.DRY_RUN == 'true'
        run: npm publish --dry-run --provenance --access public

      - name: publish with NPM_TOKEN (first release)
        if: env.DRY_RUN != 'true' && env.NPM_TOKEN != ''
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: publish via OIDC trusted publishing (later releases)
        if: env.DRY_RUN != 'true' && env.NPM_TOKEN == ''
        run: npm publish --provenance --access public

      - name: confirm the registry actually has it
        if: env.DRY_RUN != 'true'
        run: |
          sleep 5
          node scripts/publish-check.mjs --verify-registry

      - name: release notes
        if: env.DRY_RUN != 'true' && startsWith(github.ref, 'refs/tags/v')
        run: gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
